[project]
name = "sc2-matchmaking-prototype"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "requests",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "python-dotenv",
    "jupyter",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*"]
